<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أقرب رقم - أوفرلاي</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #f1c40f;
      --green: #2ecc71;
      --blue: #3498db;
      --red: #e74c3c;
      --purple: #9b59b6;
      --text: #f0f0f5;
      --text-dim: rgba(200,200,220,0.6);
      --gold-glow: rgba(241,196,15,0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Tajawal', sans-serif;
      color: var(--text);
      direction: rtl;
      background: transparent;
      overflow: hidden;
    }

    .overlay-wrap {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
    }

    .ov-waiting-screen {
      text-align: center;
    }

    .ov-waiting-screen .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .ov-waiting-screen p {
      font-size: 1.4rem;
      color: var(--text-dim);
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .ov-main { display: none; width: 100%; height: 100%; position: relative; }
    .ov-main.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

    .ov-round-badge {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(22,33,62,0.85);
      padding: 8px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .ov-question {
      font-size: 2.8rem;
      font-weight: 800;
      text-align: center;
      text-shadow: 0 3px 16px rgba(0,0,0,0.9);
      line-height: 1.5;
      max-width: 80%;
    }

    .ov-timer {
      font-size: 5rem;
      font-weight: 900;
      text-shadow: 0 3px 20px rgba(0,0,0,0.9);
      margin: 20px 0;
      direction: ltr;
      transition: color 0.3s, transform 0.15s;
    }

    .ov-timer.warning { color: var(--gold); }
    .ov-timer.danger { color: var(--red); animation: pulse 0.5s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }

    .ov-answer-hidden {
      font-size: 3rem;
      letter-spacing: 12px;
      color: var(--gold);
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
    }

    .ov-guess-count {
      font-size: 1.4rem;
      color: var(--text-dim);
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      margin-top: 12px;
    }

    .ov-answer-reveal {
      font-size: 6rem;
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 40px var(--gold-glow), 0 3px 20px rgba(241,196,15,0.5);
      direction: ltr;
      animation: revealBounce 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    @keyframes revealBounce {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    .ov-result-section {
      width: 85%;
      max-width: 1000px;
    }

    .ov-rankings {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 20px 0;
    }

    .ov-rank-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 22px;
      background: rgba(22,33,62,0.75);
      border-radius: 14px;
      font-size: 1.2rem;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.06);
      animation: rankSlide 0.5s ease backwards;
      transform-origin: right center;
    }

    @keyframes rankSlide {
      from { opacity: 0; transform: translateX(60px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .ov-rank-row:nth-child(1) { background: rgba(46,204,113,0.2); border-color: rgba(46,204,113,0.15); animation-delay: 0.2s; }
    .ov-rank-row:nth-child(2) { background: rgba(52,152,219,0.15); border-color: rgba(52,152,219,0.1); animation-delay: 0.4s; }
    .ov-rank-row:nth-child(3) { background: rgba(155,89,182,0.15); border-color: rgba(155,89,182,0.1); animation-delay: 0.6s; }
    .ov-rank-row:nth-child(4) { animation-delay: 0.8s; }
    .ov-rank-row:nth-child(5) { animation-delay: 1.0s; }

    .ov-rank-row .medal { font-size: 1.8rem; min-width: 40px; text-align: center; }
    .ov-rank-row .name { flex: 1; font-weight: 700; font-size: 1.3rem; }
    .ov-rank-row .val { direction: ltr; color: var(--text-dim); }
    .ov-rank-row .diff { direction: ltr; font-size: 0.9rem; color: var(--text-dim); }
    .ov-rank-row .pts { color: var(--green); font-weight: 700; min-width: 70px; text-align: left; }

    .ov-sidebar {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 260px;
      background: rgba(22,33,62,0.85);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.06);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }

    .ov-sidebar h3 {
      color: var(--gold);
      font-size: 1rem;
      margin-bottom: 8px;
      text-align: center;
    }

    .ov-sb-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      font-size: 0.9rem;
      border-radius: 6px;
    }

    .ov-sb-row:nth-child(2) { background: rgba(241,196,15,0.08); }

    .ov-sb-row .sb-rank { min-width: 20px; color: var(--text-dim); font-weight: 700; }
    .ov-sb-row .sb-name { flex: 1; }
    .ov-sb-row .sb-score { color: var(--gold); font-weight: 700; }

    .ov-number-line-wrap {
      margin: 16px 0;
      padding: 40px 40px 60px;
      position: relative;
    }

    .number-line {
      position: relative;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      direction: ltr;
    }

    .nl-correct {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .nl-correct .star {
      font-size: 1.6rem;
      filter: drop-shadow(0 0 12px var(--gold));
      animation: starPulse 2s ease-in-out infinite;
    }

    @keyframes starPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    .nl-correct .nl-val {
      position: absolute;
      top: -28px;
      font-size: 0.85rem;
      color: var(--gold);
      font-weight: 700;
      white-space: nowrap;
    }

    .nl-point {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      animation: dotAppear 0.4s ease backwards;
    }

    @keyframes dotAppear {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    .nl-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.3);
      box-shadow: 0 0 8px rgba(0,0,0,0.3);
    }

    .nl-point .nl-label {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      white-space: nowrap;
      color: var(--text-dim);
    }

    .nl-point .nl-val {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      white-space: nowrap;
      color: var(--text-dim);
    }

    .ov-gameover { text-align: center; }

    .ov-gameover h2 {
      font-size: 3.5rem;
      margin-bottom: 24px;
      text-shadow: 0 3px 16px rgba(0,0,0,0.8);
      animation: revealBounce 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .ov-podium {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 16px;
      margin: 24px 0;
    }

    .ov-podium-item { text-align: center; }

    .ov-podium-item:nth-child(1) { animation: podiumRise 0.8s ease 0.4s backwards; order: 2; }
    .ov-podium-item:nth-child(2) { animation: podiumRise 0.8s ease 0.2s backwards; order: 1; }
    .ov-podium-item:nth-child(3) { animation: podiumRise 0.8s ease 0.6s backwards; order: 3; }

    @keyframes podiumRise {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ov-podium-name {
      font-weight: 700;
      font-size: 1.3rem;
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .ov-podium-bar {
      width: 130px;
      border-radius: 14px 14px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 900;
      color: #fff;
      padding-top: 12px;
    }

    .ov-podium-score {
      font-size: 1.1rem;
      color: var(--gold);
      margin-top: 4px;
      font-weight: 700;
    }

    .confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 9998;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas class="confetti-canvas" id="confetti-canvas"></canvas>

  <div class="overlay-wrap">
    <div id="ov-waiting-screen" class="ov-waiting-screen">
      <div class="spinner"></div>
      <p>في انتظار المضيف...</p>
    </div>

    <div class="ov-main" id="ov-main">
      <div class="ov-round-badge" id="ov-round-badge"></div>

      <div id="ov-state-waiting" class="ov-waiting-screen">
        <div class="spinner"></div>
        <p>في انتظار بداية الجولة...</p>
      </div>

      <div id="ov-state-playing" style="display:none;text-align:center;width:100%;">
        <div class="ov-question" id="ov-question"></div>
        <div class="ov-timer" id="ov-timer">20</div>
        <div class="ov-answer-hidden">❓❓❓</div>
        <div class="ov-guess-count" id="ov-guess-count"></div>
      </div>

      <div id="ov-state-results" style="display:none;width:100%;">
        <div style="text-align:center;">
          <div class="ov-question" id="ov-result-question" style="font-size:1.8rem;margin-bottom:12px;"></div>
          <div class="ov-answer-reveal" id="ov-result-answer"></div>
        </div>
        <div class="ov-result-section" style="margin:0 auto;">
          <div class="ov-rankings" id="ov-rankings"></div>
          <div class="ov-number-line-wrap" id="ov-number-line-wrap"></div>
        </div>
      </div>

      <div id="ov-state-gameover" style="display:none;" class="ov-gameover">
        <h2>🏆 النتيجة النهائية</h2>
        <div class="ov-podium" id="ov-podium"></div>
        <div id="ov-final-scores" style="max-width:400px;margin:0 auto;"></div>
      </div>

      <div class="ov-sidebar" id="ov-sidebar">
        <h3>🏅 لوحة النقاط</h3>
        <div id="ov-scoreboard"></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const $ = id => document.getElementById(id);

    const params = new URLSearchParams(location.search);
    const hostId = params.get('host');

    if (hostId) {
      socket.emit('join-overlay-by-host', { hostId });
    }

    socket.on('waiting-for-host', () => {
      $('ov-waiting-screen').style.display = '';
      $('ov-main').classList.remove('active');
    });

    socket.on('overlay-joined', data => {
      $('ov-waiting-screen').style.display = 'none';
      $('ov-main').classList.add('active');
      updateSidebar(data.players);
      $('ov-round-badge').textContent = '';
      showOvState('waiting');
    });

    socket.on('host-room-changed', data => {
      socket.emit('join-overlay-by-host', { hostId });
    });

    socket.on('round-started', data => {
      $('ov-round-badge').textContent = `الجولة ${data.roundNumber}/${data.totalRounds}`;
      $('ov-question').textContent = data.question;
      $('ov-timer').textContent = data.duration;
      $('ov-timer').className = 'ov-timer';
      $('ov-guess-count').textContent = 'التخمينات: 0';
      showOvState('playing');
    });

    socket.on('timer-tick', data => {
      $('ov-timer').textContent = data.remaining;
      if (data.remaining <= 3) $('ov-timer').className = 'ov-timer danger';
      else if (data.remaining <= 5) $('ov-timer').className = 'ov-timer warning';
    });

    socket.on('guess-count-updated', data => {
      $('ov-guess-count').textContent = `التخمينات: ${data.guessed}/${data.total}`;
    });

    socket.on('round-result', data => {
      $('ov-result-question').textContent = data.question;
      animateNumber($('ov-result-answer'), data.correctAnswer);
      renderOvRankings(data.rankings);
      if (data.numberLine) renderOvNumberLine(data.numberLine);
      else $('ov-number-line-wrap').innerHTML = '';
      updateSidebar(data.scores);
      showOvState('results');
    });

    socket.on('game-over', data => {
      renderOvGameOver(data.finalScores);
      showOvState('gameover');
      launchConfetti();
    });

    socket.on('prepare-next-round', () => showOvState('waiting'));

    socket.on('player-joined', data => updateSidebar(data.players));
    socket.on('player-left', data => updateSidebar(data.players));
    socket.on('game-reset', data => {
      updateSidebar(data.players);
      showOvState('waiting');
      $('ov-round-badge').textContent = '';
    });

    socket.on('room-closed', () => {
      showOvState('waiting');
    });

    socket.on('error-msg', data => console.error(data.message));

    function showOvState(state) {
      ['waiting', 'playing', 'results', 'gameover'].forEach(s => {
        $('ov-state-' + s).style.display = s === state ? '' : 'none';
      });
      $('ov-sidebar').style.display = state === 'gameover' ? 'none' : '';
    }

    function updateSidebar(players) {
      const sorted = [...players].sort((a, b) => (b.score || 0) - (a.score || 0));
      let html = '';
      sorted.slice(0, 10).forEach((p, i) => {
        html += `<div class="ov-sb-row">
          <span class="sb-rank">${i + 1}</span>
          <span class="sb-name">${esc(p.name)}</span>
          <span class="sb-score">${p.score || 0}</span>
        </div>`;
      });
      $('ov-scoreboard').innerHTML = html;
    }

    function renderOvRankings(rankings) {
      const medals = ['🥇', '🥈', '🥉'];
      let html = '';
      rankings.slice(0, 5).forEach((r, i) => {
        html += `<div class="ov-rank-row">
          <span class="medal">${medals[i] || (i + 1)}</span>
          <span class="name">${esc(r.name)}</span>
          <span class="val">${r.value}</span>
          <span class="diff">(فرق: ${r.difference})</span>
          <span class="pts">${r.points > 0 ? '+' + r.points + ' نقاط' : ''}</span>
        </div>`;
      });
      $('ov-rankings').innerHTML = html;
    }

    function renderOvNumberLine(nl) {
      const container = $('ov-number-line-wrap');
      let html = '<div class="number-line">';
      html += `<div class="nl-correct" style="left:${nl.correctPosition}%">
        <span class="nl-val">${nl.correctAnswer}</span>
        <span class="star">⭐</span>
      </div>`;

      const colors = ['#2ecc71', '#3498db', '#9b59b6', '#e67e22', '#e74c3c', '#1abc9c', '#e91e63', '#ff9800'];
      nl.points.slice(0, 8).forEach((p, i) => {
        const color = colors[i % colors.length];
        html += `<div class="nl-point" style="left:${p.position}%">
          <div class="nl-dot" style="background:${color}"></div>
          <span class="nl-val">${p.value}</span>
          <span class="nl-label">${esc(p.name)}</span>
        </div>`;
      });

      html += '</div>';
      container.innerHTML = html;
    }

    function renderOvGameOver(scores) {
      const medals = ['🥇', '🥈', '🥉'];
      const heights = [170, 130, 95];
      const bgColors = [
        'linear-gradient(180deg, #f1c40f, #e67e22)',
        'linear-gradient(180deg, #3498db, #2980b9)',
        'linear-gradient(180deg, #9b59b6, #8e44ad)',
      ];
      let podiumHtml = '';
      scores.slice(0, 3).forEach((p, idx) => {
        podiumHtml += `<div class="ov-podium-item">
          <div class="ov-podium-name">${esc(p.name)}</div>
          <div class="ov-podium-bar" style="height:${heights[idx]}px;background:${bgColors[idx]}">
            ${medals[idx]}
          </div>
          <div class="ov-podium-score">${p.score} نقطة</div>
        </div>`;
      });
      $('ov-podium').innerHTML = podiumHtml;

      let scoresHtml = '';
      scores.forEach((p, i) => {
        if (i < 3) return;
        scoresHtml += `<div class="ov-sb-row">
          <span class="sb-rank">${i + 1}</span>
          <span class="sb-name">${esc(p.name)}</span>
          <span class="sb-score">${p.score}</span>
        </div>`;
      });
      $('ov-final-scores').innerHTML = scoresHtml;
    }

    function launchConfetti() {
      const canvas = $('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = [];
      const confettiColors = ['#f1c40f', '#e74c3c', '#2ecc71', '#3498db', '#9b59b6', '#e67e22'];
      for (let i = 0; i < 200; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          w: Math.random() * 12 + 4,
          h: Math.random() * 6 + 3,
          color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
          vx: (Math.random() - 0.5) * 4,
          vy: Math.random() * 3 + 2,
          rot: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 12,
          opacity: 1,
        });
      }

      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        frame++;
        for (const p of pieces) {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.rotSpeed;
          p.vy += 0.04;
          if (frame > 150) p.opacity -= 0.008;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.globalAlpha = Math.max(0, p.opacity);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
        if (frame < 300 && pieces.some(p => p.opacity > 0)) {
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(animate);
    }

    function animateNumber(el, target) {
      const duration = 1500;
      const startTime = performance.now();
      const absTarget = Math.abs(target);
      const sign = target < 0 ? '-' : '';

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = Math.round(absTarget * eased);
        el.textContent = sign + current.toLocaleString();
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }
  </script>
</body>
</html>
